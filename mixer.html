<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Higgsfield Prompt-Mixer</title>
  <style>
    :root {
      --bg-dark: #090a0f;
      --card-bg: #161822;
      --border: #2a2e42;
      --accent: #7c3aed;
      --accent-pink: #ec4899;
      --text-main: #ffffff;
      --text-muted: #94a3b8;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 36px 16px;
      text-align: center;
    }

    .container {
      max-width: 500px;
      margin: 0 auto;
    }

    .back-nav {
      text-align: left;
      margin-bottom: 16px;
    }

    .back-nav a {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 13px;
      font-weight: bold;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    h1 {
      font-size: 22px;
      margin: 0 0 8px 0;
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 14px;
      margin: 0 0 20px 0;
    }

    .prompt-box {
      background-color: #0f111a;
      border: 1px solid var(--border);
      padding: 18px;
      border-radius: 12px;
      font-size: 16px;
      line-height: 1.5;
      color: #c4b5fd;
      margin-bottom: 18px;
      min-height: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .btn-group {
      display: flex;
      gap: 8px;
      justify-content: center;
      flex-wrap: wrap;
    }

    button {
      background: linear-gradient(45deg, var(--accent), var(--accent-pink));
      color: white;
      border: none;
      padding: 11px 18px;
      font-size: 14px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
    }

    .btn-secondary {
      background: #2a2e42;
    }

    .btn-danger {
      background: #ef4444;
      margin-top: 12px;
      font-size: 13px;
      padding: 8px 14px;
    }

    .saved-section {
      margin-top: 28px;
      border-top: 1px solid var(--border);
      padding-top: 20px;
      text-align: left;
    }

    .saved-section h3 {
      font-size: 16px;
      margin: 0 0 12px 0;
    }

    ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    li {
      background-color: #0f111a;
      border: 1px solid var(--border);
      padding: 10px 12px;
      border-radius: 8px;
      margin-bottom: 8px;
      font-size: 13px;
      color: var(--text-muted);
      line-height: 1.4;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="back-nav">
      <a href="index.html">← Zurück zum Creator Hub</a>
    </div>

    <div class="card">
      <h1>🎬 Higgsfield Prompt-Mixer</h1>
      <p class="subtitle">Generiere cineastische KI-Video-Ideen per Klick</p>

      <div class="prompt-box" id="idee-text">
        Klicke auf „Neue Idee“, um deinen ersten Video-Prompt zu mixen!
      </div>

      <div class="btn-group">
        <button onclick="neueIdee()">Neue Idee 🎲</button>
        <button class="btn-secondary" id="copy-button" onclick="kopierePrompt()">Kopieren 📋</button>
        <button class="btn-secondary" onclick="merkePrompt()">⭐ Merken</button>
      </div>

      <div class="saved-section">
        <h3>⭐ Meine gemerkten Prompts</h3>
        <ul id="merkliste"></ul>
        <button class="btn-danger" onclick="listeLeeren()">Liste leeren 🗑️</button>
      </div>
    </div>
  </div>

  <script>
    window.onload = function() {
      const gespeichertePrompts = JSON.parse(localStorage.getItem("meinePrompts")) || [];
      const liste = document.getElementById("merkliste");
      
      gespeichertePrompts.forEach(text => {
        const neuerPunkt = document.createElement("li");
        neuerPunkt.innerText = text;
        liste.appendChild(neuerPunkt);
      });
    };

    function zufallsElement(liste) {
      return liste[Math.floor(Math.random() * liste.length)];
    }

    function neueIdee() {
      const subjekt = [
        "Ein futuristischer Streetwear-Charakter",
        "Ein goldener Sportwagen",
        "Ein geheimnisvoller Astronaut",
        "Ein leuchtender Cyber-Samurai"
      ];

      const ort = [
        "in einer regnerischen Neon-Gasse in Tokio",
        "mitten in einer surrealen Spiegel-Wüste",
        "auf dem Dach eines Wolkenkratzers bei Sonnenuntergang",
        "in einer verlassenen unterirdischen Metro-Station"
      ];

      const kamera = [
        "dynamische FPV-Drohnenfahrt, 8k, hyperrealistisch",
        "schneller 360-Grad Orbit-Shot, cineastisches Licht",
        "langsame Zeitlupe mit starkem Tiefenschärfe-Effekt",
        "Handheld-Kamera nah am Charakter, Action-Stil"
      ];

      const fertigerPrompt = zufallsElement(subjekt) + " " + zufallsElement(ort) + ", " + zufallsElement(kamera) + ".";

      document.getElementById("idee-text").innerText = fertigerPrompt;
      document.getElementById("copy-button").innerText = "Kopieren 📋";
    }

    function kopierePrompt() {
      const text = document.getElementById("idee-text").innerText;
      navigator.clipboard.writeText(text);
      document.getElementById("copy-button").innerText = "Kopiert! ✅";
    }

    function merkePrompt() {
      const text = document.getElementById("idee-text").innerText;
      
      const neuerPunkt = document.createElement("li");
      neuerPunkt.innerText = text;
      document.getElementById("merkliste").appendChild(neuerPunkt);

      let gespeichertePrompts = JSON.parse(localStorage.getItem("meinePrompts")) || [];
      gespeichertePrompts.push(text);
      localStorage.setItem("meinePrompts", JSON.stringify(gespeichertePrompts));
    }

    function listeLeeren() {
      localStorage.removeItem("meinePrompts");
      document.getElementById("merkliste").innerHTML = "";
    }
  </script>

</body>
</html>
