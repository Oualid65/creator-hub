<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Content Pipeline & Tracker</title>
  <style>
    :root {
      --bg-dark: #090a0f;
      --card-bg: #161822;
      --border: #2a2e42;
      --accent: #7c3aed;
      --accent-pink: #ec4899;
      --green: #10b981;
      --amber: #f59e0b;
      --blue: #3b82f6;
      --text-main: #ffffff;
      --text-muted: #94a3b8;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 36px 16px;
    }

    .container {
      max-width: 580px;
      margin: 0 auto;
    }

    .back-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .back-nav a {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 13px;
      font-weight: bold;
    }

    .back-nav a:hover {
      color: white;
    }

    h1 {
      font-size: 24px;
      margin: 0 0 6px 0;
      text-align: center;
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 14px;
      text-align: center;
      margin-bottom: 24px;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 24px;
    }

    .stat-box {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 10px;
      text-align: center;
    }

    .stat-number {
      font-size: 24px;
      font-weight: 800;
      margin: 0 0 4px 0;
    }

    .stat-label {
      font-size: 12px;
      color: var(--text-muted);
      margin: 0;
    }

    .input-panel {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 24px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .input-row {
      display: flex;
      gap: 8px;
    }

    input, select {
      background-color: #0f111a;
      color: white;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 14px;
      outline: none;
    }

    input {
      flex: 1;
    }

    input:focus, select:focus {
      border-color: var(--accent);
    }

    .add-btn {
      background: linear-gradient(45deg, var(--accent), var(--accent-pink));
      color: white;
      border: none;
      border-radius: 8px;
      padding: 12px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
    }

    .pipeline-item {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .item-info h3 {
      margin: 0 0 6px 0;
      font-size: 14px;
      line-height: 1.4;
    }

    .tool-tag {
      font-size: 11px;
      color: #c4b5fd;
      background: rgba(124, 58, 237, 0.2);
      padding: 2px 8px;
      border-radius: 4px;
    }

    .item-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status-btn {
      border: none;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
      color: white;
      white-space: nowrap;
    }

    .status-idee { background-color: var(--blue); }
    .status-produktion { background-color: var(--amber); color: #000; }
    .status-online { background-color: var(--green); }

    .delete-btn {
      background: transparent;
      border: 1px solid #ef4444;
      color: #ef4444;
      border-radius: 6px;
      padding: 5px 8px;
      cursor: pointer;
      font-size: 12px;
    }

    .delete-btn:hover {
      background: #ef4444;
      color: white;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Navigation zurück zum Hub oder direkt zum Mixer -->
    <div class="back-nav">
      <a href="index.html">← Zurück zum Creator Hub</a>
      <a href="mixer.html" style="color: #c4b5fd;">🎬 Zum Prompt-Mixer →</a>
    </div>

    <h1>📊 AI Content Pipeline</h1>
    <p class="subtitle">Plane deine Shorts von der ersten Idee bis zum fertigen Upload</p>

    <!-- Live-KPI-Dashboard (Hier ist die Box "💡 Ideen") -->
    <div class="stats-grid">
      <div class="stat-box">
        <p class="stat-number" id="count-idee" style="color: var(--blue);">0</p>
        <p class="stat-label">💡 Ideen</p>
      </div>
      <div class="stat-box">
        <p class="stat-number" id="count-prod" style="color: var(--amber);">0</p>
        <p class="stat-label">🎬 In Schnitt</p>
      </div>
      <div class="stat-box">
        <p class="stat-number" id="count-online" style="color: var(--green);">0</p>
        <p class="stat-label">🚀 Online</p>
      </div>
    </div>

    <!-- Neues Video manuell anlegen -->
    <div class="input-panel">
      <div class="input-row">
        <input type="text" id="video-titel" placeholder="Neues Short-Thema (z. B. Cyber-Samurai in Tokio)...">
        <select id="video-tool">
          <option value="🎥 Higgsfield + ElevenLabs">🎥 Higgsfield + Voice</option>
          <option value="💰 Affiliate-Tool-Tipp">💰 Affiliate-Short</option>
          <option value="⚡ Coding-Reise">⚡ Coding-Reise</option>
        </select>
      </div>
      <button class="add-btn" onclick="neuesVideoHinzufuegen()">+ In die Pipeline aufnehmen</button>
    </div>

    <!-- Hier erscheinen deine gesendeten Prompts als Karten mit dem blauen "💡 Idee"-Button -->
    <div id="pipeline-liste"></div>
  </div>

  <script>
    let projekte = JSON.parse(localStorage.getItem("creatorPipeline")) || [];

    window.onload = function() {
      zeichneBoard();
    };

    function neuesVideoHinzufuegen() {
      const titelFeld = document.getElementById("video-titel");
      const toolFeld = document.getElementById("video-tool");
      const titel = titelFeld.value.trim();

      if (titel === "") return;

      const neuesProjekt = {
        id: Date.now(),
        titel: titel,
        tool: toolFeld.value,
        status: "idee"
      };

      projekte.push(neuesProjekt);
      titelFeld.value = "";
      speichernUndZeichnen();
    }

    function wechselStatus(id) {
      projekte.forEach(p => {
        if (p.id === id) {
          if (p.status === "idee") p.status = "produktion";
          else if (p.status === "produktion") p.status = "online";
          else p.status = "idee";
        }
      });
      speichernUndZeichnen();
    }

    function loescheVideo(id) {
      projekte = projekte.filter(p => p.id !== id);
      speichernUndZeichnen();
    }

    function speichernUndZeichnen() {
      localStorage.setItem("creatorPipeline", JSON.stringify(projekte));
      zeichneBoard();
    }

    function zeichneBoard() {
      const liste = document.getElementById("pipeline-liste");
      liste.innerHTML = "";

      let zaehlerIdee = 0;
      let zaehlerProd = 0;
      let zaehlerOnline = 0;

      projekte.forEach(p => {
        if (p.status === "idee") zaehlerIdee++;
        if (p.status === "produktion") zaehlerProd++;
        if (p.status === "online") zaehlerOnline++;

        let statusText = "💡 Idee (Klick ➔)";
        let statusKlasse = "status-idee";
        if (p.status === "produktion") {
          statusText = "🎬 In Schnitt (Klick ➔)";
          statusKlasse = "status-produktion";
        } else if (p.status === "online") {
          statusText = "🚀 Online ✓";
          statusKlasse = "status-online";
        }

        const karte = document.createElement("div");
        karte.className = "pipeline-item";
        karte.innerHTML = `
          <div class="item-info">
            <h3>${p.titel}</h3>
            <span class="tool-tag">${p.tool}</span>
          </div>
          <div class="item-actions">
            <button class="status-btn ${statusKlasse}" onclick="wechselStatus(${p.id})">${statusText}</button>
            <button class="delete-btn" onclick="loescheVideo(${p.id})">🗑️</button>
          </div>
        `;
        liste.appendChild(karte);
      });

      document.getElementById("count-idee").innerText = zaehlerIdee;
      document.getElementById("count-prod").innerText = zaehlerProd;
      document.getElementById("count-online").innerText = zaehlerOnline;
    }
  </script>

</body>
</html>
